name: Slice
options:
  deploymentTarget:
    macOS: "15.0"
packages:
  SliceCore:
    path: .
  # Animated border beam (SwiftUI port of beam.jakubantalik.com), used around the capture bar.
  BorderBeamKit:
    path: Packages/BorderBeamKit
  # Eased gradients (vendored from inspo/SmoothGradient) for edge fades without banding.
  SmoothGradient:
    path: Packages/SmoothGradient
  # In-app updates from the GitHub releases' signed appcast.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      # Notarization rejects the debugger entitlement Xcode otherwise injects.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  Slice:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: App/Resources
        optional: true
      # Device frame images, kept as a folder (<Model>/<Model> - <Colour>.png) that DeviceFrameCatalog reads.
      - path: App/DeviceFrames
        type: folder
        buildPhase: resources
      # The same layout for Android phones, kept apart so iPhones are never matched to them.
      - path: App/AndroidFrames
        type: folder
        buildPhase: resources
      # Built-in background wallpapers, offered alongside the user's own library.
      - path: App/Wallpapers
        type: folder
        buildPhase: resources
      # Built-in background music; catalog.json titles the tracks and sorts them into categories.
      - path: App/Music
        type: folder
        buildPhase: resources
    dependencies:
      - package: SliceCore
      - package: BorderBeamKit
      - package: SmoothGradient
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Slice
        CFBundleName: Slice
        CFBundleShortVersionString: "0.2.8"
        CFBundleVersion: "10"
        LSApplicationCategoryType: public.app-category.video
        NSCameraUsageDescription: Slice records your camera alongside your screen.
        NSMicrophoneUsageDescription: Slice records your voice alongside your screen.
        NSSpeechRecognitionUsageDescription: Slice transcribes your recordings on this Mac so you can edit by text and add subtitles.
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # Updates (Sparkle): the signed appcast attached to the latest GitHub release, which skips drafts and
        # prereleases. Both the feed and the update archive must be signed with the EdDSA key this public key matches.
        SUFeedURL: https://github.com/rit3zh/slice/releases/latest/download/appcast.xml
        SUPublicEDKey: lblJIPOGcD5mILxJrLhI6wOcc5Q8chkhS+VtX0SxW5c=
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: true
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 14400
        # Projects are `.slice` packages (a folder Finder shows as one file) that Slice opens and edits.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Slice Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes:
              - $(PRODUCT_BUNDLE_IDENTIFIER).project
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER).project
            UTTypeDescription: Slice Project
            UTTypeConformsTo:
              - com.apple.package
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - slice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Slice
        PRODUCT_NAME: Slice
        GENERATE_INFOPLIST_FILE: NO
        # App/Slice.entitlements, or App/Slice-SelfSigned.entitlements for self-signed builds (Config/Signing.xcconfig).
        # Keep the two the same apart from library validation.
        CODE_SIGN_ENTITLEMENTS: $(SLICE_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
